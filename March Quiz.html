  const d=document.createElement("div");
  d.className="question"+(i===0?" active":"");
  d.id="q"+i;
  d.innerHTML=
    "<b>"+(i+1)+". "+q.q+"</b>"+
    "<div class='timer' id='t"+i+"'>14</div>"+
    q.o.map((o,j)=>
      "<label class='option' onclick='selectAnswer("+i+","+j+",this)'>"+
      "<input type='radio' name='q"+i+"'> "+
      String.fromCharCode(65+j)+". "+o+
      "</label>"
    ).join("");
  quiz.appendChild(d);
  locked[i]=false;
});

startTimer();

/* TIMER */
function startTimer(){
  clearInterval(timer);
  timeLeft=14;
  updateTimer();

  timer=setInterval(()=>{
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){
      clearInterval(timer);
      unattempted++;
      lockQuestion();
      moveNext();
    }
  },1000);
}

function updateTimer(){
  const t=document.getElementById("t"+current);
  t.innerText=timeLeft;
  t.style.background=
    "conic-gradient(#28a745 "+(timeLeft/14*360)+"deg,#eee 0deg)";
}

/* ANSWER */
function selectAnswer(i,j,lbl){
  if(i!==current || locked[i]) return;

  locked[i]=true;
  clearInterval(timer);

  const opts=document.getElementsByName("q"+i);
  opts.forEach((o,k)=>{
    if(k===quizData[i].a)
      o.parentElement.classList.add("correct");
    o.disabled=true;
  });

  if(j===quizData[i].a) correct++;
  else{
    lbl.classList.add("wrong");
    wrong++;
  }
  moveNext();
}

/* LOCK + NEXT */
function lockQuestion(){
  locked[current]=true;

  const opts = document.getElementsByName("q"+current);
  opts.forEach((o,k)=>{
    if(k === quizData[current].a){
      o.parentElement.classList.add("correct"); // 👈 SHOW correct answer
    }
    o.disabled = true;
  });
}

function moveNext(){
  document.getElementById("q"+current).classList.remove("active");
  current++;
  if(current>=quizData.length) return;
  document.getElementById("q"+current).classList.add("active");
  startTimer();
}

/* RESULT */
function submitQuiz(){
  for(let i=0;i<quizData.length;i++){
    if(!locked[i]) unattempted++;
  }
  document.getElementById("result").innerHTML=
    "✅ Correct: "+correct+"<br>"+
    "❌ Wrong: "+wrong+"<br>"+
    "⏳ Unattempted: "+unattempted+"<br>"+
    "🎯 Score: "+correct+"/"+quizData.length;
}
</script>
</body>
</html>
